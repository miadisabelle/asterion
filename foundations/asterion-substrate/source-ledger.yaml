  - id: kybartas-bidarra-2017
    field: computational-narratology
    kind: peer-reviewed
    title: "From computational narrative analysis to generation"
    venue: Proc. 12th International Conference on the Foundations of Digital Games
    year: 2017
    doi: 10.1145/3102071.3106362
    url: https://dl.acm.org/doi/10.1145/3102071.3106362
    supports: >
      The analysis/generation taxonomy — the distinction that matters for a
      system that records narrative rather than generating it.
    verified: true

  - id: news-narrative-2023
    field: computational-narratology
    kind: preprint
    title: "A Survey on Event-based News Narrative Extraction"
    year: 2023
    url: https://arxiv.org/pdf/2302.08351
    supports: >
