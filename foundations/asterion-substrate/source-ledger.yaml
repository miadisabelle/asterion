  # ---- field 5: provenance & governance ----
  - id: w3c-prov-o
    field: provenance-and-governance
    kind: standard
    title: "PROV-O: The PROV Ontology"
    publisher: W3C
    status: W3C Recommendation
    date: 2013-04-30
    url: https://www.w3.org/TR/prov-o/
    supports: >
      Entity / Activity / Agent and wasGeneratedBy, used, wasAssociatedWith,
      wasDerivedFrom; provenance as information usable to assess quality,
      reliability, trustworthiness. The model Asterion's actor_* columns gesture
      at and do not populate.
    verified: true

  - id: fnigc-ocap
    field: provenance-and-governance
    kind: primary-authority
    title: "The First Nations Principles of OCAP®"
    publisher: First Nations Information Governance Centre (FNIGC)
    url: https://fnigc.ca/ocap-training/
    supports: >
      Ownership, Control, Access, Possession; established 1998 by Canadian First
      Nations leadership; FNIGC holds the trademark and defends the integrity of
      the principles.
    verified: true

  - id: fnigc-ocap-brochure
    field: provenance-and-governance
    kind: primary-authority
    title: "The First Nations Principles of OCAP® (brochure)"
    publisher: FNIGC
    url: https://fnigc.ca/wp-content/uploads/2022/10/OCAP_Brochure_20220927_web.pdf
    supports: The four principles stated by the body that holds them.
    verified: true

  - id: wilson-2008
    field: provenance-and-governance
    kind: primary-book
    title: "Research Is Ceremony: Indigenous Research Methods"
    author: Shawn Wilson
    publisher: Fernwood Publishing
    year: 2008
    isbn: "9781552662816"
    url: https://fernwoodpublishing.ca/books/research-is-ceremony-shawn-wilson
    supports: >
      Relational accountability; knowledge held in relationship rather than
      owned; methodology starting from the Indigenous paradigm and borrowing
      Western tools rather than the reverse.
    verified: true

  - id: ocap-springer-2024
    field: provenance-and-governance
    kind: peer-reviewed
    title: "Advancing First Nations Principles of OCAP"
    publisher: Springer Nature
    doi: 10.1007/978-3-031-56806-0_8
    url: https://link.springer.com/chapter/10.1007/978-3-031-56806-0_8
    supports: Peer-reviewed treatment of OCAP® in contemporary data governance practice.
    verified: true

  # ---- field 6: traceability engineering ----
  - id: gotel-finkelstein-1994
    field: traceability-engineering
    kind: peer-reviewed
    title: "An Analysis of the Requirements Traceability Problem"
    author: Orlena Gotel; Anthony Finkelstein
    venue: Proc. 1st International Conference on Requirements Engineering (ICRE '94), pp. 94-101
    year: 1994
    doi: 10.1109/ICRE.1994.292398
    url: https://doi.org/10.1109/ICRE.1994.292398
    supports: >
      The standard definition — following the life of a requirement forwards and
      backwards, from origins through specification to deployment and ongoing
      refinement. Also the pre- vs post-requirements distinction.
    verified: true

  - id: pre-rs-traceability-slr-2023
    field: traceability-engineering
    kind: peer-reviewed
    title: "A systematic literature review of pre-requirements specification traceability"
    venue: Requirements Engineering
    doi: 10.1007/s00766-023-00412-z
    url: https://dl.acm.org/doi/abs/10.1007/s00766-023-00412-z
    supports: >
      Pre-requirements traceability as the persistent weak point — the link back
      to origin and rationale is what decays.
    verified: true

  - id: ir-traceability-mapping-2025
    field: traceability-engineering
    kind: peer-reviewed
    title: "A systematic mapping study of information retrieval-based requirements traceability methods"
    venue: Information Processing & Management
    url: https://www.sciencedirect.com/science/article/abs/pii/S0306457325002286
    supports: >
      Current state of automated trace-link recovery; supports the claim that
      hand-maintained links decay and emitted links survive.
    verified: true

