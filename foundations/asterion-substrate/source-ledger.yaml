  method: deep-research-foundations
  verification_status: live-web-verified
  note: >
    Every entry marked verified:true was returned by live web search on
    2026-08-06. Entries marked kind:practitioner are included under the
    context-layer rule that a field's vocabulary is cited where it originated —
    event sourcing and CQRS were named in practitioner writing before the
    academic literature adopted them. Book entries cite publisher or ISBN
    rather than a retailer listing.

sources:

  # ---- field 1: event-sourced architecture ----
  - id: fowler-event-sourcing
    field: event-sourced-architecture
    kind: practitioner
    title: "Event Sourcing"
    author: Martin Fowler
    date: 2005-12-12
    url: https://martinfowler.com/eaaDev/EventSourcing.html
    supports: >
      The defining test of event sourcing — application state can be discarded
      and rebuilt confidently from the log. Used to argue Asterion currently
      logs rather than sources.
    quote: >
      "We can discard the application state completely and rebuild it by
      re-running the events from the event log on an empty application."
    verified: true
    verification_method: fetched 2026-08-06

  - id: fowler-cqrs
    field: event-sourced-architecture
    kind: practitioner
    title: "CQRS"
    author: Martin Fowler
    url: https://martinfowler.com/bliki/CQRS.html
    supports: >
      Command Query Responsibility Segregation, attributed to Greg Young; the
      read model differs from the write model, and CQRS composes with event
      sourcing via Event Collaboration.
    verified: true

  - id: young-cqrs-docs
    field: event-sourced-architecture
    kind: practitioner
    title: "CQRS Documents"
    author: Greg Young
    supports: >
      No business logic between an event and its storage, to avoid versioning
      tangles that make replay after a bug fix unsound.
    url: https://cqrs.files.wordpress.com/2010/11/cqrs_documents.pdf
    verified: false
    caution: >
      Claim confirmed via secondary sources in live search; the primary PDF URL
      was not fetched. Treat the attribution as solid and the URL as unchecked.

  - id: msft-event-sourcing
    field: event-sourced-architecture
    kind: standards-adjacent
    title: "Event Sourcing pattern — Azure Architecture Center"
    publisher: Microsoft
    url: https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
    supports: Append-only store semantics and projection rebuild as a documented pattern.
    verified: true

  # ---- field 2: knowledge representation ----
  - id: angles-gutierrez-2008
    field: knowledge-representation
    kind: peer-reviewed
    title: "Survey of graph database models"
    author: Renzo Angles; Carlos Gutiérrez
    venue: ACM Computing Surveys 40(1)
    year: 2008
    doi: 10.1145/1322432.1322433
    url: https://dl.acm.org/doi/10.1145/1322432.1322433
    supports: >
      The founding comparative treatment of graph data models; property graph
      defined as a directed labeled graph whose vertices and edges carry
      arbitrary property-value pairs.
    verified: true

  - id: hogan-kg-2021
    field: knowledge-representation
    kind: peer-reviewed
    title: "Knowledge Graphs"
    author: Aidan Hogan et al.
    venue: ACM Computing Surveys 54(4)
    year: 2021
    doi: 10.1145/3447772
    url: https://dl.acm.org/doi/10.1145/3447772
    supports: >
      Current synthesis of the field; nodes as entities and edges as relations,
      conforming to either the RDF or property-graph model.
    verified: true

  # ---- field 3: structural dynamics ----
  - id: fritz-polr
    field: structural-dynamics
    kind: primary-book
    title: "The Path of Least Resistance: Learning to Become the Creative Force in Your Own Life"
    author: Robert Fritz
    publisher: Fawcett/Ballantine
    isbn: "9780449903377"
    supports: >
      Structure determines behaviour; structural tension as the generative
      relationship between desired result and current reality; advancing vs
      oscillating patterns.
    verified: true

  - id: fritz-polr-managers
    field: structural-dynamics
    kind: primary-book
    title: "The Path of Least Resistance for Managers"
    author: Robert Fritz
    publisher: Berrett-Koehler
    url: https://www.robertfritz.com/
    supports: >
      Organizational application — underlying structures produce advancing or
      oscillating outcomes; the way out of oscillation is structural redesign.
    verified: true

  - id: bodaken-fritz-mmot
    field: structural-dynamics
    kind: primary-book
    title: "The Managerial Moment of Truth: The Essential Step in Helping People Improve Performance"
    author: Bruce Bodaken; Robert Fritz
    publisher: Free Press / Simon & Schuster
    isbn: "9781451655353"
    url: https://www.simonandschuster.com/books/The-Managerial-Moment-of-Truth/Bruce-Bodaken/9781451655353
    supports: >
      The MMOT protocol that `asterion.mmot_evaluations` encodes; reported at
      Blue Shield of California as adding 25-40% to organizational capacity.
    verified: true

  - id: systems-thinker-polr
    field: structural-dynamics
    kind: practitioner
    title: "New Insights on the Path of Least Resistance"
    venue: The Systems Thinker
    url: https://thesystemsthinker.com/wp-content/uploads/pdfs/220706pk.pdf
    supports: Independent restatement of advancing vs oscillating patterns.
    verified: true

  - id: thwink-structural-tension
    field: structural-dynamics
    kind: practitioner
    title: "Structural Tension"
    publisher: Thwink.org
    url: https://www.thwink.org/soft/info/process/structural/StructuralTension.html
    supports: >
      Structural tension as a dynamic force seeking equilibrium — the framing
      that makes gap-language a category error.
    verified: true

  # ---- field 4: computational narratology ----
  - id: alhussain-azmi-2021
    field: computational-narratology
    kind: peer-reviewed
    title: "Automatic Story Generation: A Survey of Approaches"
    venue: ACM Computing Surveys 54(5)
    year: 2021
    doi: 10.1145/3453156
    url: https://dl.acm.org/doi/10.1145/3453156
    supports: Standard survey of computational story generation and its relation to narratology.
